          generatedAt,
        ]
      properties:
        id: { type: string, format: uuid }
        estatePlanId: { type: string, format: uuid }
        version: { type: integer, format: int32 }
        title: { type: string }
        valueAsOfDate: { type: string, format: date-time }
        baseCurrency: { type: string }
        contentHash: { type: string }
        generatedAt: { type: string, format: date-time }
    EstateSnapshot:
      type: object
      additionalProperties: false
      required:
        [
          id,
          estatePlanId,
          version,
          title,
          valueAsOfDate,
          baseCurrency,
          contentHash,
          generatedAt,
          content,
        ]
      properties:
        id: { type: string, format: uuid }
        estatePlanId: { type: string, format: uuid }
        version: { type: integer, format: int32 }
        title: { type: string }
        valueAsOfDate: { type: string, format: date-time }
        baseCurrency: { type: string }
        contentHash: { type: string }
        generatedAt: { type: string, format: date-time }
