      description: Requires `portfolio:write`. Browser sessions also require a trusted Origin and `X-CSRF-Token`. Reported amounts are major-unit decimal strings in the account currency.
      security:
        - sessionCookie: []
        - apiKey: []
      parameters:
        - $ref: "#/components/parameters/MutationCSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PositionReconciliationCreateRequest"
      responses:
        "201":
          description: Position reconciliation created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResourceIDResponse"
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /position-reconciliations/{id}:
    delete:
      operationId: deletePositionReconciliation
      summary: Delete a position-account reconciliation
      description: Requires `portfolio:write`. Browser sessions also require a trusted Origin and `X-CSRF-Token`.
      security:
        - sessionCookie: []
        - apiKey: []
      parameters:
        - $ref: "#/components/parameters/ResourceID"
        - $ref: "#/components/parameters/MutationCSRFToken"
      responses:
        "204": { description: Position reconciliation deleted }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /account-conversions/preview:
    post:
      operationId: previewAccountConversion
      summary: Preview converting a balance account into a position account
      description: Requires `portfolio:write`. Browser sessions also require a trusted Origin and `X-CSRF-Token`. Monetary inputs are major-unit decimal strings; preview also requires a UUID idempotency key in the body or `Idempotency-Key` header.
      security:
        - sessionCookie: []
        - apiKey: []
      parameters:
        - $ref: "#/components/parameters/MutationCSRFToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountConversionRequest"
      responses:
        "200":
          description: Account conversion preview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountConversionPreview"
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /account-conversions:
    post:
      operationId: executeAccountConversion
      summary: Convert a balance account into a position account
      description: Requires `portfolio:write`. Browser sessions also require a trusted Origin and `X-CSRF-Token`. Supply a UUID in the body or `Idempotency-Key`; when both are present they must match.
      security:
        - sessionCookie: []
        - apiKey: []
      parameters:
        - $ref: "#/components/parameters/MutationCSRFToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountConversionRequest"
      responses:
        "200":
          description: An idempotent account conversion was replayed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountConversionResult"
        "201":
          description: Account converted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountConversionResult"
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /estate:
    get:
      operationId: getEstateWorkspace
      summary: Return the current user's estate-planning workspace
      description: Authenticate with a browser session or a Bearer API key that grants `portfolio:read`.
      security:
        - sessionCookie: []
        - apiKey: []
      responses:
        "200":
          description: Owner-scoped estate workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EstateWorkspace"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
  /estate/snapshots/{id}:
    get:
      operationId: getEstateSnapshot
      summary: Return one immutable estate snapshot
      description: Authenticate with a browser session or a Bearer API key that grants `portfolio:read`.
      security:
        - sessionCookie: []
        - apiKey: []
      parameters:
        - $ref: "#/components/parameters/ResourceID"
      responses:
        "200":
          description: Owner-scoped estate snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EstateSnapshot"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /ai:
    get:
      operationId: getAIReadModel
      summary: Return AI provider metadata, usage, and review availability
      description: Authenticate with a browser session or a Bearer API key that grants `portfolio:read`. Stored API key secrets are never returned.
      security:
        - sessionCookie: []
        - apiKey: []
      responses:
        "200":
          description: Owner-scoped AI configuration and usage metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AIRead"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
  /api-keys:
    get:
      operationId: listApiKeys
      summary: List the current user's API keys
      security:
        - sessionCookie: []
      responses:
        "200":
          description: API key metadata without secrets or hashes
          content:
            application/json:
              schema:
                type: object
                required: [keys]
                properties:
                  keys:
                    type: array
                    items:
                      $ref: "#/components/schemas/APIKeyMetadata"
        "401":
          $ref: "#/components/responses/Problem"
    post:
      operationId: createApiKey
      summary: Create an API key and return its secret once
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAPIKeyRequest"
      responses:
        "201":
          description: API key created; token is returned only in this response
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/APIKeyMetadata"
                  - type: object
                    required: [token]
                    properties:
                      token:
                        type: string
                        writeOnly: true
        "401":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /api-keys/{id}:
    delete:
      operationId: revokeApiKey
      summary: Revoke one API key owned by the current user
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: API key revoked
        "404":
          $ref: "#/components/responses/Problem"
  /api-keys/revoke-all:
    post:
      operationId: revokeAllApiKeys
      summary: Revoke every active API key owned by the current user
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "200":
          description: API keys revoked
          content:
            application/json:
              schema:
                type: object
                required: [revoked]
                properties:
                  revoked:
                    type: integer
                    minimum: 0
        "401":
          $ref: "#/components/responses/Problem"
  /auth/signup:
    post:
      operationId: signup
      summary: Create a local user and browser session
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignupRequest"
      responses:
        "200":
          description: Account and session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/Problem"
  /auth/login:
    post:
      operationId: login
      summary: Create a local browser session
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "401":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/Problem"
  /auth/oidc/start:
    get:
      operationId: startOidcLogin
      summary: Start an OIDC Authorization Code with PKCE sign-in
      security: []
      parameters:
        - name: next
          in: query
          schema:
            type: string
            default: /
      responses:
        "303":
          description: Redirect to the configured OIDC provider
          headers:
            Location:
              schema:
                type: string
                format: uri
        "404":
          $ref: "#/components/responses/Problem"
  /auth/oidc/callback:
    get:
      operationId: completeOidcAuthentication
      summary: Complete an OIDC login, link, or reauthentication transaction
      security: []
      parameters:
        - name: state
          in: query
          required: true
          schema:
            type: string
        - name: code
          in: query
          schema:
            type: string
        - name: error
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Session established and browser handoff returned
          content:
            text/html:
              schema:
                type: string
        "303":
          description: Login failure redirected to the login page
        "404":
          $ref: "#/components/responses/Problem"
  /auth/oidc/link:
    post:
      operationId: startOidcLink
      summary: Start linking the configured OIDC provider after local password verification
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OidcLinkRequest"
      responses:
        "303":
          description: Redirect to the configured OIDC provider
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
    delete:
      operationId: unlinkOidcIdentity
      summary: Unlink OIDC after local password verification
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordConfirmationRequest"
      responses:
        "200":
          description: OIDC unlinked and replacement session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "401":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
  /auth/oidc/reauth:
    post:
      operationId: startOidcReauthentication
      summary: Start fresh OIDC authentication for local credential management
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
        - name: next
          in: query
          schema:
            type: string
            default: /settings
      responses:
        "303":
          description: Redirect to the configured OIDC provider
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /auth/local-credential:
    post:
      operationId: enableLocalCredential
      summary: Enable local sign-in after fresh OIDC reauthentication
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnableLocalCredentialRequest"
      responses:
        "200":
          description: Local credential enabled and replacement session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "401":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
    delete:
      operationId: removeLocalCredential
      summary: Remove local sign-in after fresh OIDC reauthentication
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "200":
          description: Local credential removed and replacement session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "401":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
  /auth/logout:
    post:
      operationId: logout
      summary: End the current browser session
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "200":
          description: Session ended
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    const: signed_out
        "401":
          $ref: "#/components/responses/Problem"
  /auth/change-password:
    post:
      operationId: changePassword
      summary: Change the current user's local password
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "200":
          description: Password changed and replacement session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "401":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /auth/principal:
    get:
      operationId: getPrincipal
      summary: Inspect the effective browser-session or API-key principal
      security:
        - sessionCookie: []
        - apiKey: []
      responses:
        "200":
          description: Effective authenticated principal
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [userId, username, authMethod, scopes]
                properties:
                  userId:
                    type: string
                    format: uuid
                  username:
                    type: string
                  authMethod:
                    type: string
                    enum: [session, api_key]
                  scopes:
                    type: array
                    items:
                      $ref: "#/components/schemas/APIKeyScope"
        "401":
          $ref: "#/components/responses/Problem"
  /session:
    get:
      operationId: getSession
      summary: Return the current browser session
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Current session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "401":
          $ref: "#/components/responses/Problem"
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: wealthboard_session
    apiKey:
      type: http
      scheme: bearer
      bearerFormat: wbk_v1
  parameters:
    CSRFToken:
      name: X-CSRF-Token
      in: header
      required: true
      schema:
        type: string
        minLength: 1
    MutationCSRFToken:
      name: X-CSRF-Token
      in: header
      required: false
      description: Required when authenticating with `sessionCookie`; ignored for Bearer API keys.
      schema:
        type: string
        minLength: 1
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: UUID request key. When also supplied in the JSON body, both values must match.
      schema:
        type: string
        format: uuid
    AccountID:
      name: accountID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ResourceID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ArchivedFilter:
      name: archived
      in: query
      description: Select active accounts, archived accounts, or both.
      schema:
        type: string
        enum: [active, archived, all]
        default: active
    AccountIDFilter:
      name: accountId
      in: query
      schema:
        type: string
        format: uuid
    TransactionType:
      name: type
      in: query
      schema:
        $ref: "#/components/schemas/TransactionType"
    FromDate:
      name: from
      in: query
      description: Inclusive start date.
      schema:
        type: string
        format: date
    ToDate:
      name: to
      in: query
      description: Inclusive end date; must not precede `from`.
      schema:
        type: string
        format: date
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    Offset:
      name: offset
      in: query
      schema:
        type: integer
        minimum: 0
        maximum: 10000
        default: 0
  schemas:
    AuthConfig:
      type: object
      additionalProperties: false
      required: [localEnabled, oidcEnabled, providerName]
      properties:
        localEnabled: { type: boolean }
        oidcEnabled: { type: boolean }
        providerName: { type: string }
    Overview:
      type: object
      additionalProperties: false
      required:
        [
          settings,
          totals,
          accounts,
          accountCount,
          goalCount,
          currentComplete,
          missingCurrencies,
        ]
      properties:
        settings:
          type: object
          required:
            [
              displayName,
              appName,
              baseCurrency,
              timezone,
              preferredDateFormat,
              defaultDashboardPeriod,
            ]
          properties:
            displayName: { type: string }
            appName: { type: string }
            baseCurrency: { type: string }
            timezone: { type: string }
            preferredDateFormat: { type: string }
            defaultDashboardPeriod: { type: string }
        totals:
          type: object
          required: [assets, liabilities, netWorth, liquid, investible]
          properties:
            assets: { type: string, pattern: "^-?[0-9]+$" }
            liabilities: { type: string, pattern: "^-?[0-9]+$" }
            netWorth: { type: string, pattern: "^-?[0-9]+$" }
            liquid: { type: string, pattern: "^-?[0-9]+$" }
            investible: { type: string, pattern: "^-?[0-9]+$" }
        accounts:
          type: array
          items:
            type: object
            required:
              [
                id,
                name,
                currency,
                currentValueMinor,
                isLiability,
                isIncludedInNetWorth,
                categoryName,
              ]
            properties:
              id: { type: string, format: uuid }
              name: { type: string }
              currency: { type: string }
              currentValueMinor: { type: string, pattern: "^-?[0-9]+$" }
              isLiability: { type: boolean }
              isIncludedInNetWorth: { type: boolean }
              categoryName: { type: string }
              institutionName: { type: string }
        accountCount: { type: integer, minimum: 0 }
        goalCount: { type: integer, minimum: 0 }
        currentComplete: { type: boolean }
        missingCurrencies:
          type: array
          items: { type: string }
    MinorUnits:
      type: string
      description: Integer monetary amount in the currency's minor units.
      pattern: "^-?[0-9]+$"
    DecimalString:
      type: string
      description: Exact decimal value serialized as a string.
      pattern: "^-?[0-9]+(?:\\.[0-9]+)?$"
    NonNegativeDecimalString:
      type: string
      description: Exact non-negative decimal value serialized as a string.
      pattern: "^[0-9]+(?:\\.[0-9]+)?$"
    PositiveDecimalString:
      type: string
      description: Exact positive decimal value serialized as a string.
      pattern: "^(?:0*[1-9][0-9]*)(?:\\.[0-9]+)?$|^0*\\.[0-9]*[1-9][0-9]*$"
    CurrencyCode:
      type: string
      pattern: "^[A-Z]{3}$"
    ResourceIDResponse:
      type: object
      additionalProperties: false
      required: [id]
      properties:
        id: { type: string, format: uuid }
    MutationStatusResponse:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { type: string }
    SettingsMutationRequest:
      type: object
      additionalProperties: false
      required:
        [
          displayName,
          appName,
          baseCurrency,
          timezone,
          preferredDateFormat,
          defaultDashboardPeriod,
          sessionTimeoutMinutes,
          positionStaleDaysStock,
          positionStaleDaysEtf,
          positionStaleDaysFund,
        ]
      properties:
        displayName: { type: string, minLength: 1, maxLength: 80 }
        appName: { type: string, minLength: 1, maxLength: 80 }
        baseCurrency:
          $ref: "#/components/schemas/CurrencyCode"
        supportedCurrencies:
          type: array
          uniqueItems: true
          items:
            $ref: "#/components/schemas/CurrencyCode"
        timezone: { type: string, minLength: 1 }
        preferredDateFormat:
          type: string
          enum: [dd MMM yyyy, dd/MM/yyyy, MM/dd/yyyy, yyyy-MM-dd]
        defaultDashboardPeriod:
          type: string
          enum: [1m, 3m, 6m, 1y, all]
        sessionTimeoutMinutes: { type: integer, minimum: 15, maximum: 525600 }
        defaultGoalReturnBps: { type: integer, minimum: 0, maximum: 10000 }
        positionStaleDaysStock: { type: integer, minimum: 1 }
        positionStaleDaysEtf: { type: integer, minimum: 1 }
        positionStaleDaysFund: { type: integer, minimum: 1 }
    CategoryMutationRequest:
      type: object
      additionalProperties: false
      required: [name, icon, assetOrLiability]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        icon: { type: string, minLength: 1, maxLength: 100 }
        assetOrLiability: { type: string, enum: [asset, liability] }
        description: { type: string, maxLength: 2000 }
        isLiquid: { type: boolean }
        isInvestible: { type: boolean }
    InstitutionMutationRequest:
      type: object
      additionalProperties: false
      required: [name, type]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        type:
          type: string
          enum:
            [
              bank,
              credit_union,
              brokerage,
              asset_manager,
              pension_provider,
              insurer,
              lender,
              digital_wallet,
              government,
              employer,
              other,
            ]
        websiteUrl: { type: string, format: uri, maxLength: 500 }
        countryCode: { type: string, pattern: "^[A-Z]{2}$" }
        address: { type: string, maxLength: 500 }
        notes: { type: string, maxLength: 2000 }
    ExchangeRateMutationRequest:
      type: object
      additionalProperties: false
      required: [baseCurrency, quoteCurrency, rate, effectiveDate]
      properties:
        baseCurrency:
          $ref: "#/components/schemas/CurrencyCode"
        quoteCurrency:
          $ref: "#/components/schemas/CurrencyCode"
        rate:
          $ref: "#/components/schemas/PositiveDecimalString"
        effectiveDate: { type: string, format: date }
    ArchiveMutationRequest:
      type: object
      additionalProperties: false
      properties:
        archived: { type: boolean }
    RequiredArchiveMutationRequest:
      type: object
      additionalProperties: false
      required: [archived]
      properties:
        archived: { type: boolean }
    CategoryReorderRequest:
      type: object
      additionalProperties: false
      required: [direction]
      properties:
        direction: { type: string, enum: [up, down] }
    AccountCreateRequest:
      type: object
      additionalProperties: false
      required: [idempotencyKey, name, categoryId, currency, openingValueMinor]
      properties:
        idempotencyKey: { type: string, format: uuid }
