    EstateWorkspace:
      type: object
      additionalProperties: false
      required:
        [
          plan,
          beneficiaries,
          directives,
          allocations,
          residuaryAllocations,
          snapshots,
          currentValuesComplete,
          currentValuesWarning,
        ]
      properties:
        plan:
          oneOf:
            - $ref: "#/components/schemas/EstatePlan"
