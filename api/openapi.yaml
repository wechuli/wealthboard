        ]
      properties:
        id: { type: string, format: uuid }
        estatePlanId: { type: string, format: uuid }
        beneficiaryId: { type: string, format: uuid }
        tier: { type: string, enum: [primary, contingent] }
        allocationBps:
          { type: integer, format: int32, minimum: 1, maximum: 10000 }
        notes: { type: [string, "null"] }
        createdAt: { type: string, format: date-time }
