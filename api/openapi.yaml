            $ref: "#/components/schemas/Beneficiary"
        directives:
          type: array
          items:
            $ref: "#/components/schemas/EstateDirective"
        allocations:
          type: array
          items:
            $ref: "#/components/schemas/EstateAllocation"
        residuaryAllocations:
          type: array
          items:
            $ref: "#/components/schemas/ResiduaryAllocation"
        snapshots:
          type: array
          items:
            $ref: "#/components/schemas/EstateSnapshotMeta"
        currentValuesComplete: { type: boolean }
        currentValuesWarning: { type: string }
    AIProviderSettings:
      type: object
      additionalProperties: false
      required:
        [
          provider,
          baseUrl,
          model,
          hasStoredApiKey,
          apiKeyHint,
          includeExactAmounts,
          includeAccountNames,
          monthlyTokenLimit,
          maxOutputTokens,
          createdAt,
          updatedAt,
        ]
      properties:
        provider: { type: string }
        baseUrl: { type: string }
        model: { type: string }
        hasStoredApiKey: { type: boolean }
        apiKeyHint: { type: [string, "null"] }
        includeExactAmounts: { type: boolean }
        includeAccountNames: { type: boolean }
        monthlyTokenLimit: { type: integer, format: int32 }
        maxOutputTokens: { type: integer, format: int32 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    AIUsageEvent:
      type: object
      additionalProperties: false
      required:
        [
          id,
          provider,
          endpointHost,
          model,
          requestType,
          status,
          billingMonth,
          chargedTokens,
          inputTokens,
          outputTokens,
          latencyMs,
          errorCode,
          createdAt,
          updatedAt,
        ]
      properties:
        id: { type: string, format: uuid }
        provider: { type: string }
        endpointHost: { type: string }
        model: { type: string }
        requestType: { type: string }
        status: { type: string }
        billingMonth: { type: string, pattern: "^[0-9]{4}-[0-9]{2}$" }
        chargedTokens: { type: integer, format: int32 }
        inputTokens: { type: [integer, "null"], format: int32 }
        outputTokens: { type: [integer, "null"], format: int32 }
        latencyMs: { type: [integer, "null"], format: int32 }
        errorCode: { type: [string, "null"] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    AIUsageSummary:
      type: object
      additionalProperties: false
      required:
        [
          billingMonth,
          chargedTokens,
          remainingTokens,
          monthlyTokenLimit,
          successfulReviews,
          lastUsedAt,
        ]
      properties:
        billingMonth: { type: string, pattern: "^[0-9]{4}-[0-9]{2}$" }
        chargedTokens: { type: integer, format: int64 }
        remainingTokens: { type: integer, format: int64 }
        monthlyTokenLimit: { type: integer, format: int32 }
        successfulReviews: { type: integer, minimum: 0 }
        lastUsedAt: { type: [string, "null"], format: date-time }
    ReviewAvailability:
      type: object
      additionalProperties: false
      required:
        [
          available,
          reason,
          providerConfigured,
          storedCredentialAvailable,
          sessionCredentialAccepted,
          cooldownUntil,
          budgetRemainingTokens,
        ]
      properties:
        available: { type: boolean }
        reason: { type: string }
        providerConfigured: { type: boolean }
        storedCredentialAvailable: { type: boolean }
        sessionCredentialAccepted: { type: boolean }
        cooldownUntil: { type: [string, "null"], format: date-time }
        budgetRemainingTokens: { type: integer, format: int64 }
    AIRead:
      type: object
      additionalProperties: false
      required: [settings, usage, events, reviewAvailability]
      properties:
        settings:
          oneOf:
            - $ref: "#/components/schemas/AIProviderSettings"
            - type: "null"
        usage:
          $ref: "#/components/schemas/AIUsageSummary"
        events:
          type: array
          items:
            $ref: "#/components/schemas/AIUsageEvent"
        reviewAvailability:
          $ref: "#/components/schemas/ReviewAvailability"
    AIProvider:
      type: string
      enum: [openai, deepseek, custom]
    AISettingsInput:
      type: object
      additionalProperties: false
      required:
        [
          provider,
          baseUrl,
          model,
          includeExactAmounts,
          includeAccountNames,
          monthlyTokenLimit,
          maxOutputTokens,
        ]
      properties:
        provider: { $ref: "#/components/schemas/AIProvider" }
        baseUrl: { type: string, format: uri }
        model: { type: string, minLength: 1, maxLength: 200 }
        includeExactAmounts:
          {
            type: boolean,
            description: Whether exact financial amounts may be shared with the configured provider.,
          }
        includeAccountNames:
          {
            type: boolean,
            description: Whether private account names may be shared with the configured provider.,
          }
        monthlyTokenLimit: { type: integer, minimum: 10000, maximum: 100000000 }
        maxOutputTokens:
          {
            type: integer,
            minimum: 256,
            description: Must not exceed `monthlyTokenLimit`.,
          }
    AIWorkflowSettings:
      type: object
      additionalProperties: false
      required:
        [
          provider,
          baseUrl,
          model,
          includeExactAmounts,
          includeAccountNames,
          monthlyTokenLimit,
          maxOutputTokens,
          hasStoredApiKey,
          apiKeyHint,
          updatedAt,
        ]
      properties:
        provider: { $ref: "#/components/schemas/AIProvider" }
        baseUrl: { type: string, format: uri }
        model: { type: string }
        includeExactAmounts: { type: boolean }
        includeAccountNames: { type: boolean }
        monthlyTokenLimit: { type: integer }
        maxOutputTokens: { type: integer }
        hasStoredApiKey: { type: boolean }
        apiKeyHint:
          {
            type: [string, "null"],
            description: Non-secret credential hint; plaintext and ciphertext are never returned.,
          }
        updatedAt: { type: string, format: date-time }
    AICredentialInput:
      type: object
      additionalProperties: false
      required: [apiKey]
      properties:
        apiKey: { type: string, minLength: 1, maxLength: 4096, writeOnly: true }
    AIClearUsageResult:
      type: object
      additionalProperties: false
      required: [deleted]
      properties:
        deleted: { type: integer, format: int64, minimum: 0 }
    AIReviewPeriod:
      type: string
      enum: [1m, 3m, 6m, 1y, all]
    AIReviewFocus:
      type: string
      enum: [overall, allocation, goals, cash-flow, data-quality]
    AIReviewSnapshot:
      type: object
      additionalProperties: false
      required:
        [
          schemaVersion,
          asOf,
          period,
          focus,
          baseCurrency,
          sharing,
          completeness,
          portfolio,
          allocations,
          topAccounts,
          cashFlow,
          goals,
          dataQuality,
          methodology,
        ]
      properties:
        schemaVersion: { type: integer, const: 1 }
        asOf: { type: string, minLength: 1 }
        period: { $ref: "#/components/schemas/AIReviewPeriod" }
        focus: { $ref: "#/components/schemas/AIReviewFocus" }
        baseCurrency: { $ref: "#/components/schemas/CurrencyCode" }
        sharing: { type: object, additionalProperties: true }
        completeness: { type: object, additionalProperties: true }
        portfolio: { type: object, additionalProperties: true }
        allocations: { type: [object, array] }
        topAccounts: { type: array, items: {} }
        cashFlow: { type: object, additionalProperties: true }
        goals: { type: array, items: {} }
        dataQuality: { type: [object, array] }
        methodology: { type: object, additionalProperties: true }
    AIReviewRequest:
      type: object
      additionalProperties: false
      required:
        [period, focus, includeExactAmounts, includeAccountNames, snapshot]
      properties:
        period: { $ref: "#/components/schemas/AIReviewPeriod" }
        focus: { $ref: "#/components/schemas/AIReviewFocus" }
        includeExactAmounts: { type: boolean }
        includeAccountNames: { type: boolean }
        apiKey:
          {
            type: string,
            minLength: 8,
            maxLength: 4096,
            writeOnly: true,
            description: Ephemeral provider key; used only when no stored credential is selected.,
          }
        snapshot: { $ref: "#/components/schemas/AIReviewSnapshot" }
    AIReviewFinding:
      type: object
      additionalProperties: false
      required:
        [id, category, severity, confidence, title, explanation, evidenceRefs]
      properties:
        id: { type: string, minLength: 1, maxLength: 80 }
        category:
          {
            type: string,
            enum:
              [data-quality, allocation, liquidity, cash-flow, goals, general],
          }
        severity: { type: string, enum: [info, attention, high] }
        confidence: { type: string, enum: [low, medium, high] }
        title: { type: string, minLength: 1, maxLength: 140 }
        explanation: { type: string, minLength: 1, maxLength: 700 }
        evidenceRefs:
          { type: array, minItems: 1, maxItems: 6, items: { type: string } }
    AIReview:
      type: object
      additionalProperties: false
      required:
        [
          schemaVersion,
          headline,
          executiveSummary,
          dataQuality,
          strengths,
          attentionItems,
          goalObservations,
          questions,
          possibleNextChecks,
          limitations,
        ]
      properties:
        schemaVersion: { type: integer, const: 1 }
        headline: { type: string, minLength: 1, maxLength: 160 }
        executiveSummary: { type: string, minLength: 1, maxLength: 1400 }
        dataQuality:
          {
            type: array,
            maxItems: 6,
            items: { $ref: "#/components/schemas/AIReviewFinding" },
          }
        strengths:
          {
            type: array,
            maxItems: 6,
            items: { $ref: "#/components/schemas/AIReviewFinding" },
          }
        attentionItems:
          {
            type: array,
            maxItems: 8,
            items: { $ref: "#/components/schemas/AIReviewFinding" },
          }
        goalObservations:
          {
            type: array,
            maxItems: 6,
            items: { $ref: "#/components/schemas/AIReviewFinding" },
          }
        questions:
          { type: array, maxItems: 6, items: { type: string, maxLength: 300 } }
        possibleNextChecks:
          { type: array, maxItems: 6, items: { type: string, maxLength: 300 } }
        limitations:
          {
            type: array,
            minItems: 1,
            maxItems: 8,
            items: { type: string, minLength: 1, maxLength: 300 },
          }
    AIReviewResult:
      type: object
      additionalProperties: false
      required: [review, snapshot, provider, usage, generatedAt]
      properties:
        review: { $ref: "#/components/schemas/AIReview" }
        snapshot: { $ref: "#/components/schemas/AIReviewSnapshot" }
        provider:
          type: object
          additionalProperties: false
          required: [name, host, model]
          properties:
            name: { $ref: "#/components/schemas/AIProvider" }
            host: { type: string }
            model: { type: string }
        usage:
          type: object
          additionalProperties: false
          required: [inputTokens, outputTokens]
          properties:
            inputTokens: { type: [integer, "null"] }
            outputTokens: { type: [integer, "null"] }
        generatedAt: { type: string, format: date-time }
    AISourceUpload:
      type: object
      additionalProperties: false
      required: [file]
      properties:
        file:
          type: string
          format: binary
          description: One TXT, CSV, TSV, JSON, PDF, XLSX, or DOCX file, maximum 5 MiB.
        documentPassword:
          {
            type: string,
            maxLength: 1024,
            writeOnly: true,
            description: Optional and accepted for PDF files only.,
          }
    AISourceUnit:
      type: object
      additionalProperties: false
      required: [id, location, text]
      properties:
        id: { type: string, pattern: "^source-[0-9]+$" }
        location: { type: string, minLength: 1, maxLength: 200 }
        text: { type: string, minLength: 1, maxLength: 65536 }
    AISource:
      type: object
      additionalProperties: false
      required: [units, warnings]
      properties:
        units:
          {
            type: array,
            minItems: 1,
            maxItems: 1000,
            items: { $ref: "#/components/schemas/AISourceUnit" },
          }
        warnings: { type: array, maxItems: 100, items: { type: string } }
    AISourceResult:
      type: object
      additionalProperties: false
      required: [source]
      properties:
        source: { $ref: "#/components/schemas/AISource" }
    AISourceError:
      type: object
      additionalProperties: false
      required: [error, code]
      properties:
        error: { type: string }
        code: { type: string }
    AIConversionRequest:
      type: object
      additionalProperties: false
      required: [source, configurationHash, consent, trackingMode, currency]
      properties:
        source: { $ref: "#/components/schemas/AISource" }
        configurationHash: { type: string, pattern: "^[a-f0-9]{64}$" }
        consent: { type: boolean, const: true }
        apiKey: { type: string, minLength: 8, maxLength: 4096, writeOnly: true }
        trackingMode: { type: string, enum: [balance, positions] }
        currency: { $ref: "#/components/schemas/CurrencyCode" }
    AIDraftReference:
      type: object
      additionalProperties: false
      required: [collection, row, sourceIds]
      properties:
        collection: { type: string }
        row: { type: integer, minimum: 1 }
        sourceIds:
          {
            type: array,
            minItems: 1,
            items: { type: string, pattern: "^source-[0-9]+$" },
          }
    AIExclusion:
      type: object
      additionalProperties: false
      required: [sourceId, reason]
      properties:
        sourceId: { type: string, pattern: "^source-[0-9]+$" }
        reason: { type: string }
    AIConversionDraft:
      type: object
      additionalProperties: false
      required: [content, references, exclusions, issues]
      properties:
        content:
          {
            type: string,
            description: Generated Wealthboard import document content.,
          }
        references:
          {
            type: array,
            items: { $ref: "#/components/schemas/AIDraftReference" },
          }
        exclusions:
          { type: array, items: { $ref: "#/components/schemas/AIExclusion" } }
        issues: { type: array, maxItems: 100, items: { type: string } }
    Problem:
      type: object
      additionalProperties: false
      required: [type, title, status, detail]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
    APIKeyScope:
      type: string
      enum:
        - portfolio:read
        - portfolio:write
        - imports:write
        - exports:read
        - ai:invoke
    APIKeyMetadata:
      type: object
      additionalProperties: false
      required: [id, name, prefix, scopes, createdAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        prefix:
          type: string
        scopes:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: "#/components/schemas/APIKeyScope"
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: [string, "null"]
          format: date-time
        lastUsedAt:
          type: [string, "null"]
          format: date-time
        revokedAt:
          type: [string, "null"]
          format: date-time
    CreateAPIKeyRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        scopes:
          type: array
          minItems: 1
          uniqueItems: true
          default: [portfolio:read]
          items:
            $ref: "#/components/schemas/APIKeyScope"
        expiresAt:
          type: [string, "null"]
          format: date-time
    LoginRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username:
          type: string
          pattern: "^[a-z0-9._-]{3,32}$"
        password:
          type: string
          minLength: 1
          maxLength: 256
    SignupRequest:
      type: object
      additionalProperties: false
      required: [username, displayName, password, confirmPassword]
      properties:
        username:
          type: string
          pattern: "^[a-z0-9._-]{3,32}$"
        displayName:
          type: string
          minLength: 1
          maxLength: 80
        baseCurrency:
          type: string
          pattern: "^[A-Z]{3}$"
          default: KES
        password:
          type: string
          minLength: 12
          maxLength: 256
        confirmPassword:
          type: string
          minLength: 12
          maxLength: 256
    SessionResponse:
      type: object
      additionalProperties: false
      required: [user, csrfToken]
      properties:
        user:
          type: object
          additionalProperties: false
          required: [id, username]
          properties:
            id:
              type: string
              format: uuid
            username:
              type: string
        csrfToken:
          type: string
    ChangePasswordRequest:
      type: object
      additionalProperties: false
      required: [currentPassword, newPassword, confirmPassword]
      properties:
        currentPassword:
          type: string
          minLength: 1
          maxLength: 256
        newPassword:
          type: string
          minLength: 12
          maxLength: 256
        confirmPassword:
          type: string
          minLength: 12
          maxLength: 256
    PasswordConfirmationRequest:
      type: object
      additionalProperties: false
      required: [currentPassword]
      properties:
        currentPassword:
          type: string
          minLength: 1
          maxLength: 256
    OidcLinkRequest:
      type: object
      additionalProperties: false
      required: [currentPassword]
      properties:
        currentPassword:
          type: string
          minLength: 1
          maxLength: 256
        next:
          type: string
          default: /settings
    EnableLocalCredentialRequest:
      type: object
      additionalProperties: false
      required: [username, password, confirmPassword]
      properties:
        username:
          type: string
          pattern: "^[a-z0-9._-]{3,32}$"
        password:
          type: string
          minLength: 12
          maxLength: 256
        confirmPassword:
          type: string
          minLength: 12
          maxLength: 256
  responses:
    CorporateActionCreated:
      description: Corporate-action event group created or an identical request replayed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/EventGroupResponse"
    Problem:
      description: Request failed
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
