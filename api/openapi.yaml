          application/json:
            schema:
              $ref: "#/components/schemas/OidcLinkRequest"
      responses:
        "303":
          description: Redirect to the configured OIDC provider
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
    delete:
      operationId: unlinkOidcIdentity
      summary: Unlink OIDC after local password verification
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordConfirmationRequest"
      responses:
        "200":
          description: OIDC unlinked and replacement session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "401":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
  /auth/oidc/reauth:
    post:
      operationId: startOidcReauthentication
      summary: Start fresh OIDC authentication for local credential management
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
        - name: next
          in: query
          schema:
            type: string
            default: /settings
      responses:
        "303":
          description: Redirect to the configured OIDC provider
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /auth/local-credential:
    post:
      operationId: enableLocalCredential
      summary: Enable local sign-in after fresh OIDC reauthentication
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnableLocalCredentialRequest"
      responses:
        "200":
          description: Local credential enabled and replacement session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "401":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
    delete:
      operationId: removeLocalCredential
      summary: Remove local sign-in after fresh OIDC reauthentication
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "200":
          description: Local credential removed and replacement session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "401":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
  /auth/logout:
    post:
      operationId: logout
      summary: End the current browser session
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "200":
          description: Session ended
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    const: signed_out
        "401":
          $ref: "#/components/responses/Problem"
  /auth/change-password:
    post:
      operationId: changePassword
      summary: Change the current user's local password
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "200":
          description: Password changed and replacement session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "401":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /auth/principal:
    get:
      operationId: getPrincipal
      summary: Inspect the effective browser-session or API-key principal
      security:
        - sessionCookie: []
        - apiKey: []
      responses:
        "200":
          description: Effective authenticated principal
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [userId, username, authMethod, scopes]
                properties:
                  userId:
                    type: string
                    format: uuid
                  username:
                    type: string
                  authMethod:
                    type: string
                    enum: [session, api_key]
                  scopes:
                    type: array
                    items:
                      $ref: "#/components/schemas/APIKeyScope"
        "401":
          $ref: "#/components/responses/Problem"
  /session:
    get:
      operationId: getSession
      summary: Return the current browser session
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Current session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "401":
          $ref: "#/components/responses/Problem"
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: wealthboard_session
    apiKey:
      type: http
      scheme: bearer
      bearerFormat: wbk_v1
  parameters:
    CSRFToken:
      name: X-CSRF-Token
      in: header
      required: true
      schema:
        type: string
        minLength: 1
    MutationCSRFToken:
      name: X-CSRF-Token
      in: header
      required: false
      description: Required when authenticating with `sessionCookie`; ignored for Bearer API keys.
      schema:
        type: string
        minLength: 1
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: UUID request key. When also supplied in the JSON body, both values must match.
      schema:
        type: string
        format: uuid
    PreviewHash:
      name: X-Preview-Hash
      in: header
      required: false
      description: Required for raw JSON or CSV commit bodies. Lowercase SHA-256 hash returned by preview. Multipart commits instead use the required `hash` form field.
      schema:
        type: string
        pattern: "^[a-f0-9]{64}$"
    AccountID:
      name: accountID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ResourceID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ArchivedFilter:
      name: archived
      in: query
      description: Select active accounts, archived accounts, or both.
      schema:
        type: string
        enum: [active, archived, all]
        default: active
    AccountIDFilter:
      name: accountId
      in: query
      schema:
        type: string
        format: uuid
    TransactionType:
      name: type
      in: query
      schema:
        $ref: "#/components/schemas/TransactionType"
    FromDate:
      name: from
      in: query
      description: Inclusive start date.
      schema:
        type: string
        format: date
    ToDate:
      name: to
      in: query
      description: Inclusive end date; must not precede `from`.
      schema:
        type: string
        format: date
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    Offset:
      name: offset
      in: query
      schema:
        type: integer
        minimum: 0
        maximum: 10000
        default: 0
  headers:
    NoStore:
      description: Prevents storage of private financial or credential metadata.
      schema:
        type: string
        const: no-store
    UserArchiveDisposition:
      description: Attachment filename for the JSON user archive.
      schema:
        type: string
        const: 'attachment; filename="wealthboard-export.json"'
    TransactionsDisposition:
      description: Attachment filename for the transaction CSV.
      schema:
        type: string
        const: 'attachment; filename="wealthboard-transactions.csv"'
    AccountsDisposition:
      description: Attachment filename for the account CSV.
      schema:
        type: string
        const: 'attachment; filename="wealthboard-accounts.csv"'
  requestBodies:
    ImportPreview:
      required: true
      description: A raw JSON/CSV body up to 5 MiB, or multipart data containing one file up to 5 MiB and at most 1 MiB additional request overhead. Multipart `format` is needed only when the filename has no `.csv` or `.json` extension.
      content:
        application/json:
          schema:
            oneOf:
              - $ref: "#/components/schemas/AccountHistoryImportEnvelope"
              - $ref: "#/components/schemas/InvestmentHistoryImportEnvelope"
        text/csv:
          schema:
            { type: string, contentMediaType: "text/csv", maxLength: 5242880 }
        application/csv:
          schema:
            { type: string, contentMediaType: "text/csv", maxLength: 5242880 }
        multipart/form-data:
          schema:
            type: object
            additionalProperties: false
            required: [file]
            properties:
              file:
                type: string
                format: binary
                description: CSV or JSON file, maximum 5 MiB.
              format: { type: string, enum: [csv, json] }
    ImportCommit:
      required: true
      description: The exact previously previewed content. Raw JSON/CSV uses `X-Preview-Hash`; multipart uses its required `hash` field. File and overhead limits are identical to preview.
      content:
        application/json:
          schema:
            oneOf:
              - $ref: "#/components/schemas/AccountHistoryImportEnvelope"
              - $ref: "#/components/schemas/InvestmentHistoryImportEnvelope"
        text/csv:
          schema:
            { type: string, contentMediaType: "text/csv", maxLength: 5242880 }
        application/csv:
          schema:
            { type: string, contentMediaType: "text/csv", maxLength: 5242880 }
        multipart/form-data:
          schema:
            type: object
            additionalProperties: false
            required: [file, hash]
            properties:
              file:
                type: string
                format: binary
                description: CSV or JSON file, maximum 5 MiB.
              format: { type: string, enum: [csv, json] }
              hash: { type: string, pattern: "^[a-f0-9]{64}$" }
  schemas:
    AuthConfig:
      type: object
      additionalProperties: false
      required: [localEnabled, oidcEnabled, providerName]
      properties:
        localEnabled: { type: boolean }
        oidcEnabled: { type: boolean }
        providerName: { type: string }
    Overview:
      type: object
      additionalProperties: false
      required:
        [
          settings,
          totals,
          accounts,
          accountCount,
          goalCount,
          currentComplete,
          missingCurrencies,
        ]
      properties:
        settings:
          type: object
          required:
            [
              displayName,
              appName,
              baseCurrency,
              timezone,
              preferredDateFormat,
              defaultDashboardPeriod,
            ]
          properties:
            displayName: { type: string }
            appName: { type: string }
            baseCurrency: { type: string }
            timezone: { type: string }
            preferredDateFormat: { type: string }
            defaultDashboardPeriod: { type: string }
        totals:
          type: object
          required: [assets, liabilities, netWorth, liquid, investible]
          properties:
            assets: { type: string, pattern: "^-?[0-9]+$" }
            liabilities: { type: string, pattern: "^-?[0-9]+$" }
            netWorth: { type: string, pattern: "^-?[0-9]+$" }
            liquid: { type: string, pattern: "^-?[0-9]+$" }
            investible: { type: string, pattern: "^-?[0-9]+$" }
        accounts:
          type: array
          items:
            type: object
            required:
              [
                id,
                name,
                currency,
                currentValueMinor,
                isLiability,
                isIncludedInNetWorth,
                categoryName,
              ]
            properties:
              id: { type: string, format: uuid }
              name: { type: string }
              currency: { type: string }
              currentValueMinor: { type: string, pattern: "^-?[0-9]+$" }
              isLiability: { type: boolean }
              isIncludedInNetWorth: { type: boolean }
              categoryName: { type: string }
              institutionName: { type: string }
        accountCount: { type: integer, minimum: 0 }
        goalCount: { type: integer, minimum: 0 }
        currentComplete: { type: boolean }
        missingCurrencies:
          type: array
          items: { type: string }
    MinorUnits:
      type: string
      description: Integer monetary amount in the currency's minor units.
      pattern: "^-?[0-9]+$"
    DecimalString:
      type: string
      description: Exact decimal value serialized as a string.
      pattern: "^-?[0-9]+(?:\\.[0-9]+)?$"
    NonNegativeDecimalString:
      type: string
      description: Exact non-negative decimal value serialized as a string.
      pattern: "^[0-9]+(?:\\.[0-9]+)?$"
    PositiveDecimalString:
      type: string
      description: Exact positive decimal value serialized as a string.
      pattern: "^(?:0*[1-9][0-9]*)(?:\\.[0-9]+)?$|^0*\\.[0-9]*[1-9][0-9]*$"
    CurrencyCode:
      type: string
      pattern: "^[A-Z]{3}$"
    EventGroupResponse:
      type: object
      additionalProperties: false
      required: [eventGroupId]
      properties:
        eventGroupId: { type: string, format: uuid }
    StockSplitRequest:
      type: object
      additionalProperties: false
      required: [accountId, instrumentId, numerator, denominator, actionDate]
      properties:
        accountId: { type: string, format: uuid }
        instrumentId: { type: string, format: uuid }
        numerator: { $ref: "#/components/schemas/PositiveDecimalString" }
        denominator: { $ref: "#/components/schemas/PositiveDecimalString" }
        actionDate: { type: string, format: date }
        idempotencyKey:
          {
            type: string,
            format: uuid,
            description: Required unless supplied in `Idempotency-Key`.,
          }
        notes: { type: string, maxLength: 2000 }
    SpinoffRequest:
      type: object
      additionalProperties: false
      required:
        [
          accountId,
          sourceInstrumentId,
          newInstrumentId,
          numerator,
          denominator,
          actionDate,
        ]
      properties:
        accountId: { type: string, format: uuid }
        sourceInstrumentId: { type: string, format: uuid }
        newInstrumentId: { type: string, format: uuid }
        numerator: { $ref: "#/components/schemas/PositiveDecimalString" }
        denominator: { $ref: "#/components/schemas/PositiveDecimalString" }
        actionDate: { type: string, format: date }
        idempotencyKey:
          {
            type: string,
            format: uuid,
            description: Required unless supplied in `Idempotency-Key`.,
          }
        notes: { type: string, maxLength: 2000 }
    MergerRequest:
      type: object
      additionalProperties: false
      required:
        [
          accountId,
          sourceInstrumentId,
          destinationInstrumentId,
          numerator,
          denominator,
          actionDate,
        ]
      properties:
        accountId: { type: string, format: uuid }
        sourceInstrumentId: { type: string, format: uuid }
        destinationInstrumentId: { type: string, format: uuid }
        numerator: { $ref: "#/components/schemas/PositiveDecimalString" }
        denominator: { $ref: "#/components/schemas/PositiveDecimalString" }
        actionDate: { type: string, format: date }
        idempotencyKey:
          {
            type: string,
            format: uuid,
            description: Required unless supplied in `Idempotency-Key`.,
          }
        notes: { type: string, maxLength: 2000 }
    DividendReinvestmentRequest:
      type: object
      additionalProperties: false
      required:
        [
          accountId,
          instrumentId,
          dividendAmount,
          quantity,
          unitPrice,
          tradeCurrency,
          activityDate,
        ]
      properties:
        accountId: { type: string, format: uuid }
        instrumentId: { type: string, format: uuid }
        dividendAmount: { $ref: "#/components/schemas/PositiveDecimalString" }
        quantity: { $ref: "#/components/schemas/PositiveDecimalString" }
        unitPrice: { $ref: "#/components/schemas/PositiveDecimalString" }
        tradeCurrency: { $ref: "#/components/schemas/CurrencyCode" }
        feeAmount: { $ref: "#/components/schemas/NonNegativeDecimalString" }
        feeCurrency: { $ref: "#/components/schemas/CurrencyCode" }
        cashEffect: { $ref: "#/components/schemas/DecimalString" }
        appliedExchangeRate:
          { $ref: "#/components/schemas/PositiveDecimalString" }
        activityDate: { type: string, format: date }
        idempotencyKey:
          {
            type: string,
            format: uuid,
            description: Required unless supplied in `Idempotency-Key`.,
          }
        notes: { type: string, maxLength: 2000 }
    InKindTransferRequest:
      type: object
      additionalProperties: false
      required:
        [
          sourceAccountId,
          destinationAccountId,
          instrumentId,
          quantity,
          transferDate,
        ]
      properties:
        sourceAccountId: { type: string, format: uuid }
        destinationAccountId: { type: string, format: uuid }
        instrumentId: { type: string, format: uuid }
        quantity: { $ref: "#/components/schemas/PositiveDecimalString" }
        transferDate: { type: string, format: date }
        feeAmount: { $ref: "#/components/schemas/NonNegativeDecimalString" }
        idempotencyKey:
          {
            type: string,
            format: uuid,
            description: Required unless supplied in `Idempotency-Key`.,
          }
        notes: { type: string, maxLength: 2000 }
    AccountHistoryImportEnvelope:
      type: object
      additionalProperties: false
      required: [format, version, transactions]
      properties:
        format: { type: string }
        version: { type: integer }
        transactions:
          type: array
          items: { $ref: "#/components/schemas/AccountHistoryImportSourceRow" }
    AccountHistoryImportSourceRow:
      type: object
      additionalProperties: false
      required: [type, amount, date]
      properties:
        external_id: { type: [string, "null"] }
        type:
          type: string
          enum:
            [
              deposit,
              withdrawal,
              interest,
              dividend,
              capital_gain,
              capital_loss,
              fee,
              purchase,
              sale,
              manual_adjustment,
              liability_payment,
              liability_increase,
            ]
        amount: { $ref: "#/components/schemas/DecimalString" }
        date: { type: string, format: date }
        description: { type: [string, "null"] }
        notes: { type: [string, "null"] }
    InvestmentHistoryImportEnvelope:
      type: object
      additionalProperties: false
      required:
        [
          format,
          version,
          instruments,
          position_events,
          cash_transactions,
          prices,
        ]
      properties:
        format: { type: string }
        version: { type: integer }
        instruments:
          type: array
          items: { $ref: "#/components/schemas/InvestmentImportInstrument" }
        position_events:
          type: array
          items: { $ref: "#/components/schemas/InvestmentImportEvent" }
        cash_transactions:
          type: array
          items: { $ref: "#/components/schemas/InvestmentImportCash" }
        prices:
          type: array
          items: { $ref: "#/components/schemas/InvestmentImportPrice" }
    InvestmentImportInstrument:
      type: object
      additionalProperties: false
      required: [external_id, name, identifier_type, asset_type, quote_currency]
      properties:
        external_id: { type: string }
        name: { type: string }
        symbol: { type: [string, "null"] }
        identifier_type: { type: string }
        identifier: { type: [string, "null"] }
        exchange_mic: { type: [string, "null"] }
        asset_type: { type: string }
        quote_currency: { $ref: "#/components/schemas/CurrencyCode" }
    InvestmentImportEvent:
      type: object
      additionalProperties: false
      required:
        [
          external_id,
          instrument_external_id,
          type,
          quantity,
          trade_currency,
          trade_date,
        ]
      properties:
        external_id: { type: string }
        instrument_external_id: { type: string }
        type: { type: string }
        quantity: { $ref: "#/components/schemas/DecimalString" }
        unit_price:
          { type: [string, "null"], pattern: "^-?[0-9]+(?:\\.[0-9]+)?$" }
        trade_currency: { $ref: "#/components/schemas/CurrencyCode" }
        fee_amount:
          { type: [string, "null"], pattern: "^-?[0-9]+(?:\\.[0-9]+)?$" }
        fee_currency: { type: [string, "null"], pattern: "^[A-Z]{3}$" }
        cash_effect:
          { type: [string, "null"], pattern: "^-?[0-9]+(?:\\.[0-9]+)?$" }
        applied_exchange_rate:
          { type: [string, "null"], pattern: "^-?[0-9]+(?:\\.[0-9]+)?$" }
        opening_cost_basis:
          { type: [string, "null"], pattern: "^-?[0-9]+(?:\\.[0-9]+)?$" }
        event_group_id: { type: [string, "null"], format: uuid }
        trade_date: { type: string, format: date }
        settlement_date: { type: [string, "null"], format: date }
        description: { type: [string, "null"] }
        notes: { type: [string, "null"] }
    InvestmentImportCash:
      type: object
      additionalProperties: false
      required: [type, amount, date]
      properties:
        external_id: { type: [string, "null"] }
        type: { type: string }
        amount: { $ref: "#/components/schemas/DecimalString" }
        date: { type: string, format: date }
        event_group_id: { type: [string, "null"], format: uuid }
        description: { type: [string, "null"] }
        notes: { type: [string, "null"] }
    InvestmentImportPrice:
      type: object
      additionalProperties: false
      required:
        [external_id, instrument_external_id, price, effective_date, source]
      properties:
        external_id: { type: string }
        instrument_external_id: { type: string }
        price: { $ref: "#/components/schemas/PositiveDecimalString" }
        effective_date: { type: string, format: date }
        source: { type: string }
        provenance: { type: [string, "null"] }
    ImportAccount:
      type: object
      additionalProperties: false
      required: [id, name, currency]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        institution: { type: string }
        currency: { $ref: "#/components/schemas/CurrencyCode" }
    ImportDateRange:
      type: object
      additionalProperties: false
      required: [from, to]
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date }
    AccountHistoryImportRow:
      type: object
      additionalProperties: false
      required: [row, externalId, status, code, message, transactionId]
      properties:
        row: { type: integer, minimum: 1 }
        externalId: { type: [string, "null"] }
        status: { type: string }
        code: { type: string }
        message: { type: string }
        transactionId: { type: [string, "null"], format: uuid }
        type: { type: string }
        amount:
          { type: string, description: Canonical major-unit decimal string. }
        date: { type: string, format: date }
    AccountHistoryImportSummary:
      type: object
      additionalProperties: false
      required: [skippedDuplicates, failed]
      properties:
        ready: { type: integer, minimum: 0 }
        imported: { type: integer, minimum: 0 }
        skippedDuplicates: { type: integer, minimum: 0 }
        failed: { type: integer, minimum: 0 }
    AccountHistoryImportResult:
      type: object
      additionalProperties: false
      required: [account, dateRange, summary, rows]
      properties:
        hash: { type: string, pattern: "^[a-f0-9]{64}$" }
        account: { $ref: "#/components/schemas/ImportAccount" }
        dateRange:
          oneOf:
            [{ $ref: "#/components/schemas/ImportDateRange" }, { type: "null" }]
        currentBalanceMinor:
          {
            type: integer,
            format: int64,
            description: Integer amount in account-currency minor units.,
          }
        projectedBalanceMinor:
          {
            type: integer,
            format: int64,
            description: Integer amount in account-currency minor units.,
          }
        finalBalanceMinor:
          {
            type: integer,
            format: int64,
            description: Integer amount in account-currency minor units.,
          }
        netChangeMinor:
          {
            type: integer,
            format: int64,
            description: Integer amount in account-currency minor units.,
          }
        summary: { $ref: "#/components/schemas/AccountHistoryImportSummary" }
        rows:
          type: array
          items: { $ref: "#/components/schemas/AccountHistoryImportRow" }
    InvestmentImportRow:
      type: object
      additionalProperties: false
      required: [collection, row, externalId, status, code, message]
      properties:
        collection: { type: string }
        row: { type: integer, minimum: 1 }
        externalId: { type: [string, "null"] }
        status: { type: string }
        code: { type: string }
        message: { type: string }
    InvestmentInstrumentChange:
      type: object
      additionalProperties: false
      required:
        [
          instrumentId,
          externalId,
          name,
          symbol,
          resolution,
          currentQuantity,
          projectedQuantity,
          quantityChange,
        ]
      properties:
        instrumentId: { type: string, format: uuid }
        externalId: { type: string }
        name: { type: string }
        symbol: { type: [string, "null"] }
        resolution: { type: string }
        currentQuantity: { $ref: "#/components/schemas/DecimalString" }
        projectedQuantity: { $ref: "#/components/schemas/DecimalString" }
        quantityChange: { $ref: "#/components/schemas/DecimalString" }
    InvestmentEventChange:
      type: object
      additionalProperties: false
      required:
