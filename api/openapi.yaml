      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        scopes:
          type: array
          minItems: 1
          uniqueItems: true
          default: [portfolio:read]
          items:
            $ref: "#/components/schemas/APIKeyScope"
        expiresAt:
          type: [string, "null"]
          format: date-time
    LoginRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username:
          type: string
          pattern: "^[a-z0-9._-]{3,32}$"
        password:
          type: string
          minLength: 1
          maxLength: 256
    SignupRequest:
      type: object
      additionalProperties: false
      required: [username, displayName, password, confirmPassword]
      properties:
        username:
          type: string
          pattern: "^[a-z0-9._-]{3,32}$"
        displayName:
          type: string
          minLength: 1
          maxLength: 80
        baseCurrency:
          type: string
          pattern: "^[A-Z]{3}$"
          default: KES
        password:
          type: string
          minLength: 12
          maxLength: 256
        confirmPassword:
          type: string
          minLength: 12
          maxLength: 256
    SessionResponse:
      type: object
      additionalProperties: false
      required: [user, csrfToken]
      properties:
        user:
          type: object
          additionalProperties: false
          required: [id, username]
          properties:
            id:
              type: string
              format: uuid
            username:
              type: string
        csrfToken:
          type: string
