<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#60706b" />
    <title>Wealthboard is offline</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Georgia, "Times New Roman", serif;
        background: #edf2ef;
        color: #17221e;
      }
      * {
        box-sizing: border-box;
      }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background: radial-gradient(
          circle at top left,
          #ffffff 0,
          #edf2ef 42%,
          #dce7e1 100%
        );
      }
      main {
        width: min(38rem, calc(100% - 2rem));
        padding: 2rem 0;
        border-top: 4px solid #60706b;
      }
      h1 {
        margin: 0 0 0.75rem;
        font-size: clamp(2rem, 7vw, 4rem);
        font-weight: 500;
        line-height: 1;
      }
      p {
        max-width: 32rem;
        margin: 0;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 0.95rem;
        line-height: 1.7;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Wealthboard is offline</h1>
      <p>
        Your financial data was not cached. Reconnect, then reload this page to
        continue.
      </p>
    </main>
  </body>
</html>
