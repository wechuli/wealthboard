apiVersion: apps/v1
kind: Deployment
metadata:
  name: wealthboard
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: wealthboard
  template:
    metadata:
      labels:
        app: wealthboard
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: wealthboard
          image: ghcr.io/wechuliprojects/wealthboard:latest
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: wealthboard-database
                  key: database-url
            - name: APP_URL
              value: https://wealthboard.example.com
            - name: TRUST_PROXY_HEADERS
              value: "true"
            - name: AUTH_METHODS
              value: local
            - name: OIDC_ISSUER
              value: ""
            - name: OIDC_CLIENT_ID
              value: ""
            - name: OIDC_PROVIDER_NAME
              value: ""
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: wealthboard-secrets
                  key: oidc-client-secret
                  optional: true
            - name: OIDC_TRANSACTION_SECRET
              valueFrom:
                secretKeyRef:
                  name: wealthboard-secrets
                  key: oidc-transaction-secret
                  optional: true
            - name: TZ
              value: Africa/Nairobi
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: wealthboard-secrets
                  key: session-secret
            - name: AI_CREDENTIAL_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: wealthboard-secrets
                  key: ai-credential-encryption-key
                  optional: true
            - name: AI_ALLOWED_ENDPOINTS
              value: ""
            - name: AI_EXTRACTION_SOCKET
              value: /run/wealthboard/extraction.sock
          volumeMounts:
            - name: extraction-socket
              mountPath: /run/wealthboard
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          readinessProbe:
            httpGet:
              path: /api/health/ready
              port: http
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/health/live
              port: http
            periodSeconds: 30
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /api/health/ready
              port: http
            periodSeconds: 5
            failureThreshold: 24
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
        - name: extraction-worker
          image: ghcr.io/wechuliprojects/wealthboard:latest-extraction-worker
          env:
            - name: AI_EXTRACTION_SOCKET
              value: /run/wealthboard/extraction.sock
          volumeMounts:
            - name: extraction-socket
              mountPath: /run/wealthboard
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          readinessProbe:
            exec:
              command:
                - node
                - -e
                - require('node:fs').statSync(process.env.AI_EXTRACTION_SOCKET).isSocket()||process.exit(1)
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            exec:
              command:
                - node
                - -e
                - require('node:fs').statSync(process.env.AI_EXTRACTION_SOCKET).isSocket()||process.exit(1)
            periodSeconds: 30
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
      volumes:
        - name: extraction-socket
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
---
apiVersion: v1
kind: Service
metadata:
  name: wealthboard
spec:
  selector:
    app: wealthboard
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: wealthboard
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 26m
spec:
  ingressClassName: nginx
  tls:
    - hosts: [wealthboard.example.com]
      secretName: wealthboard-tls
  rules:
    - host: wealthboard.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: wealthboard
                port:
                  name: http
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: wealthboard-default-deny
spec:
  podSelector:
    matchLabels:
      app: wealthboard
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: wealthboard-allow-ingress
spec:
  podSelector:
    matchLabels:
      app: wealthboard
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
          podSelector:
            matchLabels:
              app.kubernetes.io/name: ingress-nginx
      ports:
        - protocol: TCP
          port: 3000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: wealthboard-allow-dns-and-postgres
spec:
  podSelector:
    matchLabels:
      app: wealthboard
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: database
          podSelector:
            matchLabels:
              app.kubernetes.io/name: postgresql
      ports:
        - protocol: TCP
          port: 5432
