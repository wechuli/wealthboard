apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: wealthboard-data
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: wealthboard-backups
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wealthboard
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: wealthboard
  template:
    metadata:
      labels:
        app: wealthboard
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: wealthboard
          image: ghcr.io/wechuliprojects/wealthboard:latest
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: DATABASE_PATH
              value: /data/wealthboard.db
            - name: BACKUP_PATH
              value: /backups
            - name: APP_URL
              value: https://wealthboard.example.com
            - name: TZ
              value: Africa/Nairobi
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: wealthboard-secrets
                  key: session-secret
            - name: AI_CREDENTIAL_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: wealthboard-secrets
                  key: ai-credential-encryption-key
                  optional: true
            - name: AI_ALLOWED_ENDPOINTS
              value: ""
          volumeMounts:
            - name: data
              mountPath: /data
            - name: backups
              mountPath: /backups
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: wealthboard-data
        - name: backups
          persistentVolumeClaim:
            claimName: wealthboard-backups
---
apiVersion: v1
kind: Service
metadata:
  name: wealthboard
spec:
  selector:
    app: wealthboard
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: wealthboard
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 26m
spec:
  ingressClassName: nginx
  tls:
    - hosts: [wealthboard.example.com]
      secretName: wealthboard-tls
  rules:
    - host: wealthboard.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: wealthboard
                port:
                  name: http
