name: Publish container image

on:
  release:
    types:
      - published

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/wealthboard

jobs:
  validation:
    uses: ./.github/workflows/validation.yml

  publish:
    name: Build and push
    needs: validation
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login "${REGISTRY}" --username "${{ github.actor }}" --password-stdin

      - name: Build and push release images
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          image="${REGISTRY}/${IMAGE_NAME,,}"
          docker buildx create --driver docker-container --use
          docker buildx build . \
            --file Dockerfile \
            --push \
            --tag "${image}:${RELEASE_TAG}" \
            --tag "${image}:sha-${GITHUB_SHA::7}" \
            --tag "${image}:latest" \
            --cache-from type=gha,scope=application \
            --cache-to type=gha,mode=max,scope=application
          docker buildx build . \
            --file Dockerfile \
            --target extraction-worker \
            --push \
            --tag "${image}:${RELEASE_TAG#v}-extraction-worker" \
            --tag "${image}:latest-extraction-worker" \
            --cache-from type=gha,scope=extraction-worker \
            --cache-to type=gha,mode=max,scope=extraction-worker
