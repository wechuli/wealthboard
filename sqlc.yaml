version: "2"
sql:
  - engine: "postgresql"
    schema: "db/postgres/migrations"
    queries: "db/postgres/queries"
    gen:
      go:
        package: "generated"
        out: "internal/database/generated"
        sql_package: "database/sql"
        emit_interface: true
        emit_json_tags: true
        emit_empty_slices: true
