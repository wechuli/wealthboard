services:
  worthboard:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_PATH: /data/worthboard.db
      BACKUP_PATH: /backups
      SESSION_SECRET: ${SESSION_SECRET}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD}
      APP_URL: ${APP_URL:-http://localhost:3000}
      TZ: ${TZ:-Africa/Nairobi}
    volumes:
      - worthboard-data:/data
      - worthboard-backups:/backups
    security_opt:
      - no-new-privileges:true

volumes:
  worthboard-data:
  worthboard-backups:
