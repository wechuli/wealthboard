services:
  wealthboard:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_PATH: /data/wealthboard.db
      BACKUP_PATH: /backups
      SESSION_SECRET: ${SESSION_SECRET}
      APP_URL: ${APP_URL:-http://localhost:3000}
      TZ: ${TZ:-Africa/Nairobi}
      AI_CREDENTIAL_ENCRYPTION_KEY: ${AI_CREDENTIAL_ENCRYPTION_KEY:-}
      AI_ALLOWED_ENDPOINTS: ${AI_ALLOWED_ENDPOINTS:-}
    volumes:
      - wealthboard-data:/data
      - wealthboard-backups:/backups
    security_opt:
      - no-new-privileges:true

volumes:
  wealthboard-data:
  wealthboard-backups:
