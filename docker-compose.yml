services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: wealthboard
      POSTGRES_USER: wealthboard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - wealthboard-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wealthboard -d wealthboard"]
      interval: 5s
      timeout: 5s
      retries: 10

  wealthboard:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://wealthboard:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/wealthboard?sslmode=disable
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required}
      APP_URL: ${APP_URL:-http://localhost:3000}
      AUTH_METHODS: ${AUTH_METHODS:-local}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_PROVIDER_NAME: ${OIDC_PROVIDER_NAME:-}
      OIDC_TRANSACTION_SECRET: ${OIDC_TRANSACTION_SECRET:-}
      TZ: ${TZ:-Africa/Nairobi}
      AI_CREDENTIAL_ENCRYPTION_KEY: ${AI_CREDENTIAL_ENCRYPTION_KEY:-}
      AI_ALLOWED_ENDPOINTS: ${AI_ALLOWED_ENDPOINTS:-}
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  wealthboard-postgres-data:
