services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: wealthboard_e2e
      POSTGRES_USER: wealthboard_e2e
      POSTGRES_PASSWORD: wealthboard_e2e
    ports:
      - "${E2E_POSTGRES_PORT:-55432}:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wealthboard_e2e -d wealthboard_e2e"]
      interval: 1s
      timeout: 3s
      retries: 30
